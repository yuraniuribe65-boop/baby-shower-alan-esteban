<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baby Shower — Alan Esteban Zapata Gallego</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&display=swap');
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eee3d2}
body{display:flex;justify-content:center;min-height:100vh}
.invitation{position:relative;width:min(100vw,1024px);line-height:0;overflow:hidden}
.poster{display:block;width:100%;height:auto}

/* Cuenta regresiva: valores por defecto (PC / Escritorio) */
.countdown{
 position:absolute;left:20.8%;top:68%;width:52.0%;height:8.25%;
 display:grid;grid-template-columns:repeat(4,1fr);gap:3%;
}
.count-box{
 background:rgba(255,248,234,.97);border:2px dashed #ddb77f;border-radius:18px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 line-height:1;box-shadow:0 2px 6px rgba(90,70,45,.05);
}
.num{font:38px Georgia,serif;color:#668eaa}
.lab{margin-top:8px;font:11px Arial,sans-serif;color:#76583f;letter-spacing:.8px;text-transform:uppercase}

/* Nombre de los papás: valores por defecto (PC) */
.parents-name{
 position:absolute;left:29.0%;top:89.55%;width:32.5%;height:5.0%;
 display:flex;align-items:center;justify-content:center;
 background:rgba(249,236,215,.94);
 border-radius:8px;line-height:1;
}
.parents-name span{
 font-family:'Great Vibes',cursive;color:#5d87a4;
 font-size:clamp(31px,4.4vw,54px);white-space:nowrap;
 text-shadow:0 1px 0 rgba(255,255,255,.35)
}

/* Enlace del mapa: valores por defecto (PC) */
.location-link{
 position:absolute;left:57.2%;top:83.15%;width:21.5%;height:3.8%;
 border-radius:25px;display:block;cursor:pointer;
}

/* ==========================================
   AJUSTES PARA CELULAR (Pantallas pequeñas)
   ========================================== */
@media (max-width: 600px) {
  .invitation {
    width: 100vw;
  }

  /* 1. CUENTA REGRESIVA (Movida al espacio de "Faltan") */
  .countdown {
    left: 14% !important;
    top: 56.5% !important; /* Subida exacta al recuadro de arriba */
    width: 72% !important;
    height: 6.5% !important;
    gap: 2% !important;
  }

  .count-box {
    border-radius: 10px;
    padding: 2px;
  }

  .num {
    font-size: clamp(16px, 4.5vw, 22px) !important;
  }

  .lab {
    font-size: clamp(5px, 1.5vw, 8px) !important;
    margin-top: 1px !important;
    letter-spacing: .2px !important;
  }

  /* 2. BOTÓN DE UBICACIÓN / MAPA */
  .location-link {
    left: 56% !important;
    top: 68.5% !important;
    width: 38% !important;
    height: 3.5% !important;
  }

  /* 3. NOMBRES DE LOS PAPÁS (Abajo del todo) */
  .parents-name {
    left: 25% !important;
    top: 92% !important;
    width: 50% !important;
    height: 3.5% !important;
  }

  .parents-name span {
    font-size: clamp(18px, 5vw, 26px) !important;
  }
}
</style>
