<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baby Shower Alan Esteban</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eee4d4}
body{display:flex;justify-content:center;min-height:100vh}
.invite{position:relative;width:min(100vw,1024px);line-height:0;overflow:hidden}
.bg{display:block;width:100%;height:auto}
.countdown{
 position:absolute;left:18%;top:59%;width:64%;
 display:grid;grid-template-columns:repeat(4,1fr);gap:2.2%;
 line-height:1;
}
.box{
 height:86px;background:rgba(255,249,236,.96);
 border:1.5px dashed #d8b173;border-radius:18px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 box-shadow:0 2px 5px rgba(80,60,40,.08)
}
.num{font:36px Georgia,serif;color:#6c94ae;line-height:1}
.lab{font:10px Arial,sans-serif;color:#7b6047;letter-spacing:1px;margin-top:7px;text-transform:uppercase}
.parents{
position:absolute;
left:25%;
top:88%;
width:50%;
text-align:center;
line-height:1;
}

.parents .names{
font-family:"Georgia",serif;
font-style:italic;
font-size:clamp(25px,4.1vw,44px);
color:#6b91aa;
white-space:nowrap;
}

.map{
position:absolute;
left:57.1%;
top:82.95%;
width:21.2%;
height:auto;
border-radius:22px;
display:block;
}

@media (max-width: 600px) {
  .invite {
    width: 100%;
    max-width: 100%;
  }

  .countdown {
    left: 14%;
    top: 59.5%; /* Ajustado para que encaje mejor */
    width: 72%;
    grid-template-columns: repeat(4, 1fr);
    gap: 2%;
  }

  .box {
    height: 52px; /* Reducido ligeramente para evitar desbordes */
    border-radius: 12px;
  }

  .num {
    font-size: 20px;
  }

  .lab {
    font-size: 6.5px;
    margin-top: 2px;
    letter-spacing: .3px;
  }

  .parents {
    left: 15%;
    top: 89.5%; /* Ajustado para que no se superponga con el mapa ni elementos superiores */
    width: 70%;
  }

  .parents .names {
    font-size: 21px; /* Reducido para celulares pequeños */
    white-space: nowrap;
  }

  .map {
    left: 56%;
    top: 82.5%;
    width: 36%;
    height: auto;
  }
}
</style>
</head>
<body>
<main class="invite">
<img class="bg" src="data:image/jpeg;base64,...">
<!-- Resto de tus elementos aquí -->
</main>
</body>
</html>
