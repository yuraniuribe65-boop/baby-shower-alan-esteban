<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baby Shower — Alan Esteban Zapata Gallego</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&display=swap');
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eee3d2}
body{display:flex;justify-content:center;min-height:100vh}
.invitation{position:relative;width:min(100vw,1024px);line-height:0;overflow:hidden}
.poster{display:block;width:100%;height:auto}

/* Cuenta regresiva: sustituye los números impresos de la imagen y funciona en tiempo real. */
.countdown{
 position:absolute;left:20.8%;top:68%;width:52.0%;height:8.25%;
 display:grid;grid-template-columns:repeat(4,1fr);gap:3%;
}
.count-box{
 background:rgba(255,248,234,.97);border:2px dashed #ddb77f;border-radius:18px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 line-height:1;box-shadow:0 2px 6px rgba(90,70,45,.05);
}
.num{font:38px Georgia,serif;color:#668eaa}
.lab{margin-top:8px;font:11px Arial,sans-serif;color:#76583f;letter-spacing:.8px;text-transform:uppercase}

/* Nombre de los papás: una sola capa, sin duplicar el texto de la imagen. */
.parents-name{
 position:absolute;left:29.0%;top:89.55%;width:32.5%;height:5.0%;
 display:flex;align-items:center;justify-content:center;
 background:rgba(249,236,215,.94);
 border-radius:8px;line-height:1;
}
.parents-name span{
 font-family:'Great Vibes',cursive;color:#5d87a4;
 font-size:clamp(31px,4.4vw,54px);white-space:nowrap;
 text-shadow:0 1px 0 rgba(255,255,255,.35)
}

/* El botón visible ya está dibujado en la invitación. Esta capa invisible lo hace clicable. */
.location-link{
 position:absolute;left:57.2%;top:83.15%;width:21.5%;height:3.8%;
 border-radius:25px;display:block;cursor:pointer;
}
@media (max-width: 600px) {

  .invite {
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
  }

  .bg {
    width: 100%;
    height: auto;
    display: block;
  }

  /* CUENTA REGRESIVA */
  .countdown {
    position: absolute;
    left: 14%;
    top: 68%;
    width: 72%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2%;
  }

  .box {
    height: 58px;
    border-radius: 12px;
  }

  .num {
    font-size: 23px;
  }

  .lab {
    font-size: 7px;
    margin-top: 3px;
    letter-spacing: .4px;
  }

  /* MAPA */
  .map {
    position: absolute;
    left: 57%;
    top: 82%;
    width: 38%;
    height: auto;
    border-radius: 18px;
    display: block;
  }

  /* NOMBRES DE LOS PAPÁS */
  .parents {
    position: absolute;
    left: 20%;
    top: 91%;
    width: 60%;
    text-align: center;
  }

  .parents .names {
    font-size: 24px;
    white-space: nowrap;
  }
}
</style>
</head>
